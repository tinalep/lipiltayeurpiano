<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet de piano</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet piano">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F4F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F8; --surface:#FFFFFF; --ink:#232646; --muted:#62668A; --line:#D9DBE7;
  --lh:#14907C; --lh-soft:#D3EEE8; --rh:#D8436E; --rh-soft:#F8DCE4;
  --kw:#FFFFFF; --kw-edge:#C9CBD8; --kb:#24263B; --focus:#3B5BDB;
  --t-new:#3567C9; --t-learn:#B7700A; --t-done:#2E8540; --t-review:#7B4FC4; --t-fav:#C7365F;
  --display:"Figtree", -apple-system, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14162A; --surface:#1D2037; --ink:#ECEDF7; --muted:#A0A4C4; --line:#33375A;
    --lh:#35C2A9; --lh-soft:#17463F; --rh:#F2729A; --rh-soft:#4D2236;
    --kw:#EDEDF3; --kw-edge:#9C9FB4; --kb:#0C0D18; --focus:#8EA6FF;
    --t-new:#86A8F0; --t-learn:#F0B354; --t-done:#6CC77F; --t-review:#B79AF0; --t-fav:#F28AA8;
  }
}
:root[data-theme="dark"]{
  --paper:#14162A; --surface:#1D2037; --ink:#ECEDF7; --muted:#A0A4C4; --line:#33375A;
  --lh:#35C2A9; --lh-soft:#17463F; --rh:#F2729A; --rh-soft:#4D2236;
  --kw:#EDEDF3; --kw-edge:#9C9FB4; --kb:#0C0D18; --focus:#8EA6FF;
  --t-new:#86A8F0; --t-learn:#F0B354; --t-done:#6CC77F; --t-review:#B79AF0; --t-fav:#F28AA8;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 80px}
h1,h2{font-family:var(--display);line-height:1.1;margin:0}

/* Library */
.lib-head{padding:36px 0 20px}
.lib-head h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em}
.lib-head p{color:var(--muted);margin:10px 0 0;max-width:56ch}
.hero-keys{margin:26px 0 8px;max-width:520px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--rh)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.songs{display:grid;gap:12px;margin-top:22px}
.song-card{display:grid;gap:6px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px}
.song-card:hover{border-color:var(--ink)}
.song-card h2{font-size:1.15rem;font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.song-card h2 .by{font-size:.95rem;font-weight:500;color:var(--muted)}
.tag.warn{--tc:#B04A12}
.sort{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:.88rem;font-weight:600;color:var(--muted)}
.sort select{min-height:34px;padding:4px 8px;font-size:.88rem}
.song-card .meta{color:var(--muted);font-size:.92rem}
.song-card .thumbs{grid-row:1/3;grid-column:2;display:flex;gap:6px}
@media (max-width:600px){.song-card .thumbs{grid-row:auto;grid-column:1/-1}}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:26px;margin-top:22px}
.empty h2{font-size:1.3rem;margin-bottom:6px}
.form{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px;margin-top:22px;display:grid;gap:14px}
label.f{display:grid;gap:5px;font-weight:700}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
textarea{min-height:200px;resize:vertical;line-height:1.6}
.status{font-size:.85rem;color:var(--muted)}

/* Song view */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 8px}
.title-block h1{font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:800;letter-spacing:-.01em}
.title-block .artist{color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:700;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0 12px;border-bottom:1.5px solid var(--line)}
.piano-scroll{overflow-x:auto;padding-bottom:4px}
.piano{position:relative;width:100%;min-width:620px;height:clamp(120px,22vw,190px);user-select:none;-webkit-user-select:none}
.k{position:absolute;top:0;border:0;padding:0;display:flex;align-items:flex-end;justify-content:center;font-family:var(--display);font-weight:700;transition:background-color .12s}
.k.w{height:100%;background:var(--kw);border:1px solid var(--kw-edge);border-radius:0 0 8px 8px;z-index:1;color:#3a3d5c;font-size:.72rem;padding-bottom:8px}
.k.b{height:62%;background:var(--kb);border-radius:0 0 6px 6px;z-index:2;color:#fff;font-size:.6rem;padding-bottom:6px}
.k.lh{background:var(--lh);color:#fff;border-color:var(--lh)}
.k.rh{background:var(--rh);color:#fff;border-color:var(--rh)}
.k .dot{position:absolute;left:50%;bottom:30%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--muted);opacity:.55}
.k.lh .dot,.k.rh .dot{background:#fff;opacity:.8}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.nav{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:10px}
.nav .now{min-width:0}
.now-words{font-family:var(--display);font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.now-next{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.88rem;margin-top:4px;min-width:0}
.now-next .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{min-width:52px;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:800}
.big.go{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.counter{font-size:.85rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px;font-size:.92rem}
.tools label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tools input{width:18px;height:18px;accent-color:var(--ink)}

.editor{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;display:grid;gap:14px}
.editor h2{font-size:1.1rem}
.hands{display:flex;gap:8px;flex-wrap:wrap}
.hand{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:700;display:inline-flex;gap:8px;align-items:center;min-height:44px}
.hand[aria-pressed="true"].l{border-color:var(--lh);background:var(--lh-soft)}
.hand[aria-pressed="true"].r{border-color:var(--rh);background:var(--rh-soft)}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.combos{display:flex;flex-wrap:wrap;gap:8px}
.combo{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:5px;line-height:0}
.combo:hover{border-color:var(--ink)}
.chordline{display:flex;gap:8px;flex-wrap:wrap}
.chordline input{flex:1;min-width:140px}
.err{color:var(--rh);font-size:.9rem;margin:0}

.sheet{margin-top:22px}
.line{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:flex-end;padding:10px 0;border-bottom:1px dashed var(--line)}
.mo{display:inline-flex;flex-direction:column;align-items:flex-start;gap:5px;border:1.5px solid transparent;background:transparent;border-radius:10px;padding:6px 8px;text-align:left;max-width:100%}
.mo:hover{border-color:var(--line)}
.mo .words{font-size:1.12rem;line-height:1.3;overflow-wrap:anywhere}
.mo .words.none{color:var(--muted);font-style:italic}
.mo[aria-current="true"]{background:var(--surface);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.add-end{margin-top:16px}
.foot{margin-top:40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center}

/* Import vidéo */
.imp-steps{display:grid;gap:16px;margin-top:8px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.panel h2{font-size:1.2rem}
.panel p{margin:0}
.frame{position:relative;background:#000;border-radius:10px;overflow:hidden;line-height:0}
.frame canvas{width:100%;height:auto;display:block;cursor:crosshair;touch-action:manipulation}
.instr{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.25}
.instr .n{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--ink);color:var(--paper);margin-right:8px;font-size:.85em}
input[type=range]{width:100%;accent-color:var(--ink)}
select{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--ink);min-height:44px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0%}
.preview{display:flex;flex-wrap:wrap;gap:6px}
.file-drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;display:grid;gap:10px;justify-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.two{grid-template-columns:1fr}}

/* Étiquettes */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:var(--tc);border:1px solid var(--tc);border-radius:999px;padding:1px 8px;line-height:1.4;white-space:nowrap}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc)}
.tag.fav::before{display:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;min-height:40px;display:inline-flex;gap:7px;align-items:center}
.chip .c{color:var(--muted);font-weight:400}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .c{color:var(--paper);opacity:.75}
.status-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.st{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.74rem;min-height:28px;display:inline-flex;gap:5px;align-items:center;color:var(--ink)}
.st::before{width:7px!important;height:7px!important}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tc)}
.st.fav::before{display:none}
.st[aria-pressed="true"]{border-color:var(--tc);background:var(--tc);color:var(--paper)}
.st[aria-pressed="true"]::before{background:var(--paper)}
.howto{border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--paper)}
.howto summary{font-weight:700;cursor:pointer;min-height:32px;display:flex;align-items:center}
.howto dl{margin:10px 0 6px;display:grid;gap:4px}
.howto dt{font-weight:700;margin-top:6px}
.howto dd{margin:0;color:var(--ink)}
a.btn{text-decoration:none;color:var(--ink)}
.song-item{position:relative}
.song-item .song-card{padding-right:64px}
.del-x{position:absolute;top:50%;right:10px;transform:translateY(-50%);width:44px;height:44px;border-radius:10px;border:1.5px solid transparent;background:transparent;font-size:1.1rem;opacity:.55}
.del-x:hover,.del-x:focus-visible{opacity:1;border-color:var(--rh);background:var(--rh-soft)}
@media (max-width:600px){.del-x{top:10px;transform:none}}
.confirm{background:var(--rh-soft);border:1.5px solid var(--rh);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.confirm p{margin:0}
.btn.danger-fill{background:var(--rh);border-color:var(--rh);color:#fff}
.foot + .confirm{margin-top:12px}
.seg.small button{padding:5px 11px;min-height:36px;display:inline-flex;align-items:center;gap:5px}
.words-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.word{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font-size:1.02rem;min-height:40px}
.word:hover{border-color:var(--ink);background:var(--surface)}
.more{border-top:1.5px solid var(--line);padding-top:10px}
.more summary{font-weight:700;cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--muted)}
.more-body{display:grid;gap:14px;margin-top:10px}
.word.done{opacity:.35;cursor:default;border-style:dashed}
.words-row.place{line-height:1.2;max-height:46vh;overflow:auto;padding:4px}
.words-row .lb{flex-basis:100%;height:4px}
.pin{display:inline-flex;align-items:center;padding:2px;border-radius:4px;background:var(--surface);border:1px solid var(--line)}
.sheet{line-height:2.1}
.lyr-line{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:1.15rem}
.nowrap{display:inline-flex;align-items:center;gap:4px}
.pin{border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:3px;line-height:0;display:inline-flex}
.pin.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.lw{border-radius:5px;padding:1px 2px}
.lw.on{background:var(--rh-soft);box-shadow:0 0 0 2px var(--rh-soft)}
button.lw.tap{border:0;background:transparent;font:inherit;color:inherit;padding:1px 3px;cursor:pointer}
button.lw.tap:hover{background:var(--line)}
button.lw.tap.on{background:var(--rh-soft)}
.seg-label{display:inline-flex;align-items:center;padding:0 8px;font-weight:700;font-size:.9rem}
.names{display:grid;gap:10px}
.name-row{display:flex;align-items:center;gap:14px}
.name-row img{height:40px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px}
.name-row input{max-width:160px}
.backup{margin-top:48px;padding-top:20px;border-top:1.5px solid var(--line);display:grid;gap:10px}
.backup h2{font-size:1.2rem}
label.btn{cursor:pointer}
.gbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)}
.gbar .big{min-width:34px;min-height:34px;border-radius:9px;font-size:.85rem;padding:0}
.gbar .btn{min-height:34px;padding:4px 10px;font-size:.82rem;border-radius:9px;border-width:1px}
.gbar .seg{padding:2px;border-width:1px;border-radius:9px}
.gbar .seg button{min-height:28px;padding:2px 9px;font-size:.78rem;border-radius:7px}
.gbar .speed{font-size:.78rem;gap:6px}
.gbar .speed input{width:96px}
.gtools{margin-top:6px;gap:8px;font-size:.8rem}
.gtools .seg{padding:2px;border-width:1px;border-radius:9px}
.gtools .seg button{min-height:28px;padding:2px 9px;font-size:.78rem;border-radius:7px}
.gtools .seg-label{font-size:.76rem;padding:0 4px}
.gtools input[type=checkbox]{width:15px;height:15px}
.gbar .counter{font-family:var(--display);font-weight:700;font-size:1.05rem;min-width:9ch;text-align:center}
.grid{margin-top:12px;display:grid;gap:12px}
.speed{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.speed input{width:130px;accent-color:var(--ink)}
.speed span{min-width:2ch;text-align:center}
.countdown{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(5rem,22vw,11rem);color:var(--ink);background:color-mix(in srgb,var(--paper) 55%,transparent);z-index:50;pointer-events:none}
.countdown.tick{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(1.25);opacity:.4}to{transform:scale(1);opacity:1}}
.gline{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:10px;align-items:start;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.grid.one{max-width:680px}
@media (max-width:640px){.gline{grid-template-columns:minmax(0,1fr)}}
.gcard{display:flex;flex-direction:column;align-items:stretch;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:left;width:100%;min-width:0}
.gcard svg{width:100%;height:auto;border-radius:6px}
.gsep{flex:1}
.scroll-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gcard.cur{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink)}
.gcard.bare{background:transparent;border-style:dashed}
.gwords{font-family:var(--body);font-weight:500;font-size:1.1rem;line-height:1.45;letter-spacing:0;color:var(--ink);overflow-wrap:anywhere}
.gwords.none{color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:600px){
  .wrap{padding:0 12px 80px}
  .nav{grid-template-columns:auto 1fr auto;gap:8px}
  .big{min-width:46px;min-height:46px}
}
</style>
</head>
<body>
<div id="app" class="wrap" aria-live="off"></div>

<script>
(() => {
"use strict";
const LOW = 48, HIGH = 84;           // Do3 → Do6
const NAMES = ['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const isBlack = m => [1,3,6,8,10].includes(((m % 12) + 12) % 12);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- Accords → touches ---------- */
const PC = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const FR = {do:0,'ré':2,re:2,mi:4,fa:5,sol:7,la:9,si:11};
const Q = {'':[0,4,7],'maj':[0,4,7],'M':[0,4,7],'m':[0,3,7],'min':[0,3,7],'-':[0,3,7],

function quality(rest){
  const r = String(rest || '').replace(/[()]/g, '');
  if (Q[r]) return Q[r];
  if (/^m(?!aj)/.test(r)) return Q['m'];
  return Q[''];
}
function acc(ch){ return ch === '#' || ch === '♯' ? 1 : (ch === 'b' || ch === '♭') ? -1 : 0; }
function parseRoot(s){
  let m = s.match(/^(do|ré|re|mi|fa|sol|la|si)([#♯b♭]?)(.*)$/i);
  if (m) return { pc: (FR[m[1].toLowerCase()] + acc(m[2]) + 12) % 12, rest: m[3] };
  m = s.match(/^([A-Ga-g])([#♯b♭]?)(.*)$/);
  if (m) return { pc: (PC[m[1].toUpperCase()] + acc(m[2]) + 12) % 12, rest: m[3] };

}
function chordToKeys(str){
  const s = String(str).trim().replace(/\s+/g, '');
  if (!s) return null;
  const [main, bassStr] = s.split('/');
  const r = parseRoot(main); if (!r) return null;
  const iv = Q[r.rest]; if (!iv) return null;
  let bass = r.pc;
  if (bassStr){ const b = parseRoot(bassStr); if (!b || b.rest) return null; bass = b.pc; }
  return { lh: [LOW + bass], rh: iv.map(i => 60 + r.pc + i).sort((a, b) => a - b) };
}

/* ---------- Son de piano (synthèse) ---------- */
let actx = null, master = null, voices = [];
function audio(){
  if (!actx){
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3; comp.connect(actx.destination);
    master = actx.createGain(); master.gain.value = 0.9;
    // petite réverbération de salle
    const len = Math.floor(actx.sampleRate * 2.2), ir = actx.createBuffer(2, len, actx.sampleRate);
    for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    const rev = actx.createConvolver(); rev.buffer = ir;
    const wet = actx.createGain(); wet.gain.value = 0.22;
    master.connect(comp); master.connect(rev); rev.connect(wet); wet.connect(comp);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function pianoNote(m, t, vel){
  const ctx = actx, f0 = 440 * Math.pow(2, (m - 69) / 12);
  const out = ctx.createGain(); out.gain.value = vel;
  // le son s'assombrit en s'éteignant, comme une corde
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.4;
  const bright = Math.min(12000, f0 * (6 + 10 * vel));
  lp.frequency.setValueAtTime(bright, t); lp.frequency.exponentialRampToValueAtTime(Math.max(f0 * 2, 400), t + 2.5);
  lp.connect(out); out.connect(master);
  const tau = Math.max(0.7, Math.min(7, 4 * Math.sqrt(220 / f0)));
  const B = 0.00012 * Math.pow(f0 / 110, 0.8);       // légère inharmonicité des cordes
  const N = f0 < 300 ? 10 : f0 < 900 ? 7 : 4;
  const oscs = [];
  for (let n = 1; n <= N; n++){
    const fn = n * f0 * Math.sqrt(1 + B * n * n);
    if (fn > 16000) break;
    const amp = 0.5 / Math.pow(n, 1.15) * (n === 1 ? 1 : 0.9);
    const dec = tau / (1 + 0.55 * (n - 1));
    const detunes = n <= 3 ? [-1.2, 1.4] : [0];
    detunes.forEach(cents => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = fn; o.detune.value = cents;
      const g = ctx.createGain();
      const a = amp / detunes.length;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(a, t + 0.004);
      g.gain.setTargetAtTime(a * 0.35, t + 0.004, dec * 0.12);   // attaque qui retombe vite
      g.gain.setTargetAtTime(0.0001, t + 0.004 + dec * 0.3, dec * 0.5); // puis longue résonance
      o.connect(g); g.connect(lp); o.start(t); o.stop(t + dec * 3 + 0.5);
      oscs.push(o);
    });
  }
  // frappe du marteau
  const nl = Math.floor(ctx.sampleRate * 0.04), nb = ctx.createBuffer(1, nl, ctx.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nl; i++) nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nl, 4);
  const ns = ctx.createBufferSource(); ns.buffer = nb;
  const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = Math.min(5000, f0 * 4); nf.Q.value = 0.8;
  const ng = ctx.createGain(); ng.gain.value = 0.08 * vel;
  ns.connect(nf); nf.connect(ng); ng.connect(out); ns.start(t);
  return { out, oscs };
}
/* Vrai piano enregistré (banque de sons « Fluid R3 », piano à queue) chargé depuis un CDN ;
   si le chargement échoue, on garde le piano de synthèse ci-dessus. */
const SF_URLS = [
  'https://cdn.jsdelivr.net/npm/midicube@0.9.1/examples/soundfont/acoustic_grand_piano-mp3.js',
  'https://cdn.jsdelivr.net/npm/midicube/examples/soundfont/acoustic_grand_piano-mp3.js',
  'https://cdn.jsdelivr.net/npm/music21j/soundfonts/acoustic_grand_piano-mp3.js',
  'https://cdn.jsdelivr.net/npm/midi.js/examples/soundfont/acoustic_grand_piano-mp3.js',
  'https://cdn.jsdelivr.net/npm/midi-js-soundfonts/FluidR3_GM/acoustic_grand_piano-mp3.js'
];
let sfState = 'idle', sfData = null;
const sfBuf = {};
function loadSoundfont(){
  if (sfState !== 'idle') return;
  sfState = 'loading'; soundNote();
  window.MIDI = window.MIDI || {}; window.MIDI.Soundfont = window.MIDI.Soundfont || {};
  let i = 0;
  const next = () => {
    if (i >= SF_URLS.length){ sfState = 'failed'; soundNote(); return; }
    const sc = document.createElement('script'); sc.src = SF_URLS[i++]; sc.async = true;
    sc.onload = () => {
      const d = window.MIDI && window.MIDI.Soundfont && window.MIDI.Soundfont.acoustic_grand_piano;
      if (d && Object.keys(d).length > 20){ sfData = d; sfState = 'ready'; soundNote(); const s = curSong && curSong(); if (s) preloadSong(s); }
      else next();
    };
    sc.onerror = next;
    document.head.appendChild(sc);
  };
  next();
}
const FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
function sfName(m){ return FLAT[m % 12] + (Math.floor(m / 12) - 1); }
function getBuffer(m){
  if (sfBuf[m]) return sfBuf[m];
  const uri = sfData && sfData[sfName(m)];
  if (!uri) return Promise.resolve(null);
  sfBuf[m] = new Promise(res => {
    try {
      const b64 = uri.slice(uri.indexOf(',') + 1), bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      audio().decodeAudioData(bytes.buffer, buf => res(buf), () => res(null));
    } catch (e) { res(null); }
  });
  return sfBuf[m];
}
function preloadSong(s){
  if (sfState !== 'ready' || !s) return;
  const all = new Set(); s.moments.forEach(mo => [...mo.lh, ...mo.rh].forEach(n => all.add(n)));
  [...all].forEach(getBuffer);
}
function soundNote(){
  const el = document.getElementById('sndNote'); if (!el) return;
  el.textContent = sfState === 'loading' ? 'Chargement du son de piano…' : sfState === 'failed' ? 'Son de piano indisponible : son de secours.' : '';
}
function play(notes, damp = true){
  if (!prefs.sound || !notes.length) return;
  try {
    audio();
    const t0 = actx.currentTime + 0.01;
    if (damp){
      voices.forEach(v => { try { v.out.gain.cancelScheduledValues(t0); v.out.gain.setTargetAtTime(0, t0, 0.09); } catch (e) {} });
      voices = [];
    }
    const sorted = [...new Set(notes)].sort((a, b) => a - b);
    if (sfState === 'ready'){
      const vel = 1.1 / Math.sqrt(sorted.length);
      sorted.forEach((m, i) => {
        const out = actx.createGain(); out.gain.value = vel; out.connect(master);
        voices.push({ out, oscs: [] });
        getBuffer(m).then(buf => {
          if (!buf) return;
          const src = actx.createBufferSource(); src.buffer = buf; src.connect(out);
          src.start(Math.max(actx.currentTime, t0 + i * 0.012));
        });
      });
      return;
    }
    const vel = 0.85 / Math.sqrt(sorted.length);
    sorted.forEach((m, i) => voices.push(pianoNote(m, t0 + i * 0.012, vel)));
  } catch (e) {}
}

let songs = {};

const Store = {
  mode: 'local', col: null, timers: {}, chains: {}, recent: {},
  cacheLocal(){ try { localStorage.setItem('carnet-piano-songs', JSON.stringify(songs)); } catch (e) {} },
  async init(){
    try { const raw = localStorage.getItem('carnet-piano-songs'); if (raw) songs = JSON.parse(raw) || {}; } catch (e) {}
    render();
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const id = user ? await user.id() : null;
      if (!db || !id) return;
      this.col = db.collection('data/users/' + id);
      this.mode = 'cloud';
      let first = true;
      this.col.onSnapshot(snap => {
        const seen = new Set();
        snap.docs.forEach(d => {
          seen.add(d.id);
          if (this.recent[d.id] && Date.now() - this.recent[d.id] < 5000) return;
          songs[d.id] = Object.assign(JSON.parse(JSON.stringify(d.data())), { id: d.id });
        });
        if (first){
          first = false;
          Object.values(songs).forEach(s => { if (!seen.has(s.id)) this.save(s, true); });
        } else {
          Object.keys(songs).forEach(k => { if (!seen.has(k) && !this.timers[k] && !this.recent[k]) delete songs[k]; });
        }
        this.cacheLocal();
        const a = document.activeElement;
        if (ui.view !== 'import' && !(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))) render();
      }, () => { this.mode = 'local'; if (ui.view !== 'import') render(); });
      if (ui.view !== 'import') render();
    } catch (e) {}
  },
  save(song, now){
    song.updatedAt = Date.now();
    this.recent[song.id] = Date.now();
    this.cacheLocal();
    if (!this.col) return;
    clearTimeout(this.timers[song.id]);
    const run = () => {
      delete this.timers[song.id];
      const body = JSON.parse(JSON.stringify(song)); delete body.id;
      this.chains[song.id] = (this.chains[song.id] || Promise.resolve())
        .then(() => this.col.doc(song.id).set(body))
        .then(() => { this.recent[song.id] = Date.now(); })
        .catch(err => { if (err && err.code === 'quota_exceeded') { ui.notice = "Le carnet est plein : supprime une chanson pour en ajouter une autre."; if (ui.view !== 'import') render(); } });
    };
    if (now) run(); else this.timers[song.id] = setTimeout(run, 700);
  },
  remove(id){
    delete songs[id]; this.cacheLocal();
    clearTimeout(this.timers[id]); delete this.timers[id];
    if (this.col) (this.chains[id] || Promise.resolve()).then(() => this.col.doc(id).delete()).catch(() => {});
  }
};

const DEF = { lo: LOW, hi: HIGH };
const wcache = {};
function whitesOf(r){
  const key = r.lo + '-' + r.hi;
  if (!wcache[key]){
    const a = [], idx = {}; let i = 0;
    for (let m = r.lo; m <= r.hi; m++){ idx[m] = i; if (!isBlack(m)){ a.push(m); i++; } }
    wcache[key] = { list: a, idx };
  }
  return wcache[key];
}
function songRange(s){
  let lo = LOW, hi = HIGH;
  (s.moments || []).forEach(m => [...m.lh, ...m.rh].forEach(n => { if (n < lo) lo = n; if (n > hi) hi = n; }));
  lo = lo - (((lo % 12) + 12) % 12);
  hi = hi + ((12 - (hi % 12)) % 12);
  return { lo: Math.max(21, lo), hi: Math.min(108, hi) };
}
function bigPiano(lh, rh, R = DEF){
  const W = whitesOf(R), nw = W.list.length, w = 100 / nw, bw = w * 0.62;
  let h = '';
  for (let m = R.lo; m <= R.hi; m++){
    const cls = rh.includes(m) ? ' rh' : lh.includes(m) ? ' lh' : '';
    const name = NAMES[m % 12];
    const label = prefs.names ? name : (m % 12 === 0 ? name : '');
    const hand = rh.includes(m) ? ', main droite' : lh.includes(m) ? ', main gauche' : '';
    if (isBlack(m)){
      const left = W.idx[m] * w - bw / 2;
      h += `<button class="k b${cls}" style="left:${left}%;width:${bw}%" data-act="key" data-m="${m}" aria-label="${name}${hand}">${prefs.names ? esc(name) : ''}</button>`;
    } else {
      const left = W.idx[m] * w;
      h += `<button class="k w${cls}" style="left:${left}%;width:${w}%" data-act="key" data-m="${m}" aria-label="${name}${m === 60 ? ' du milieu' : ''}${hand}">${m === 60 ? '<i class="dot"></i>' : ''}${esc(label)}</button>`;
    }
  }
  return `<div class="piano-scroll"><div class="piano" style="min-width:${Math.max(620, nw * 26)}px" role="group" aria-label="Clavier">${h}</div></div>`;
}
function mini(lh = [], rh = [], Wd = 96, H = 26, R = DEF){
  const Wh = whitesOf(R), ww = Wd / Wh.list.length; let wk = '', bk = '';
  Wh.list.forEach((m, i) => {
    const fill = rh.includes(m) ? 'var(--rh)' : lh.includes(m) ? 'var(--lh)' : 'var(--kw)';
    wk += `<rect x="${(i * ww).toFixed(2)}" y="0" width="${ww.toFixed(2)}" height="${H}" fill="${fill}" stroke="var(--kw-edge)" stroke-width=".5"/>`;
  });
  for (let m = R.lo; m <= R.hi; m++) if (isBlack(m)){
    const fill = rh.includes(m) ? 'var(--rh)' : lh.includes(m) ? 'var(--lh)' : 'var(--kb)';
    const x = Wh.idx[m] * ww - ww * 0.31;
    bk += `<rect x="${x.toFixed(2)}" y="0" width="${(ww * 0.62).toFixed(2)}" height="${(H * 0.6).toFixed(2)}" fill="${fill}"/>`;
  }
  return `<svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" aria-hidden="true" style="display:block;border-radius:3px">${wk}${bk}</svg>`;
}

  // Dans une rangée, on passe de gauche à droite au fil de sa traversée de la ligne de lecture.
  const rows = [];

      const x0 = Math.min(ctm[4], ctm[4] + ctm[0]), x1 = Math.max(ctm[4], ctm[4] + ctm[0]);
      const yb = Math.min(ctm[5], ctm[5] + ctm[3]), yt = Math.max(ctm[5], ctm[5] + ctm[3]);
      out.push({ id: a[0], x0, x1, top: H - yt, bottom: H - yb });
    }
  }
  const cache = {};
  for (const it of out){
    if (!(it.id in cache)) cache[it.id] = await imageData(page, it.id);
    it.im = cache[it.id];
  }
  let stop = null;
  const tc = await page.getTextContent();
  tc.items.forEach(t => { if (/^Accords de/i.test(t.str || '')) stop = H - t.transform[5]; });
  return out.filter(it => it.im && it.top > 60 && (it.bottom - it.top) >= 4 && (stop == null || it.top < stop - 12));
}
async function analyzeSheet(file){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, disableFontFace: true, isOffscreenCanvasSupported: false }).promise;
  let title = '', artist = '';
  const rows = [];
  for (let pn = 1; pn <= pdf.numPages; pn++){
    const page = await pdf.getPage(pn);
    if (pn === 1){
      const tc = await page.getTextContent();
      const t = tc.items.map(i => (i.str || '').trim()).find(s => /^.+\(.+\)$/.test(s));
      if (t){ const m = t.match(/^(.+?)\s*\((.+)\)$/); title = m[1]; artist = m[2]; }
    }
    const ims = await pageImagesInfo(lib, page);
    ims.forEach(it => {
      it.ink = inkOf(it.im);
      it.chord = it.im.h <= 50 && strokeRatio(it.ink, it.im.w, it.im.h) >= 0.135;
    });
    ims.sort((a, b) => a.top - b.top || a.x0 - b.x0);
    const pr = [];
    ims.forEach(it => { let r = pr.find(r => Math.abs(r.top - it.top) < 3.5); if (!r){ r = { top: it.top, page: pn, items: [] }; pr.push(r); } r.items.push(it); });
    pr.sort((a, b) => a.top - b.top); rows.push(...pr);
  }
  const unknown = new Map(), lines = [];
  const readChord = it => {
    const { w, h } = it.im, { sigs, runs } = glyphSigs(it.ink, w, h);
    const key = sigs.map(s => s[0] + ':' + s[1]).join('|');
    let name = learned.whole[key] || null;
    if (!name){ const chars = sigs.map(readGlyph); if (chars.length && chars.every(Boolean)) name = chars.join(''); }
    if (!name && !unknown.has(key)) unknown.set(key, { im: it.im, sigs });
    return { name, key, runs };
  };
  const wordsOfRow = r => {
    const words = [];
    r.items.slice().sort((a, b) => a.x0 - b.x0).forEach(it => { const sc = (it.x1 - it.x0) / it.im.w; wordSpans(it.ink, it.im.w, it.im.h).forEach(([a, b]) => words.push([it.x0 + a * sc, it.x0 + (b + 1) * sc])); });
    return words;
  };
  for (let i = 0; i < rows.length; i++){
    const r = rows[i], chords = r.items.filter(it => it.chord);
    if (chords.length){
      const nx = rows[i + 1];
      const lyr = nx && !nx.items.some(it => it.chord) && (nx.page !== r.page || nx.top - r.top < 14) ? nx : null;
      const words = lyr ? wordsOfRow(lyr) : [];
      const c = chords.sort((a, b) => a.x0 - b.x0).map(it => {
        const rd = readChord(it), sc = (it.x1 - it.x0) / it.im.w, runs = rd.runs;
        const cx = it.x0 + (runs.length ? runs[0][0] + (runs[runs.length - 1][1] - runs[0][0]) * 0.3 : 0) * sc;
        let wi = words.findIndex(([a, b]) => cx < b); if (wi < 0) wi = words.length;
        return [rd.name, lyr ? wi : 0, rd.key];
      });
      lines.push({ n: words.length, c });
      if (lyr) i++;
    } else lines.push({ n: wordsOfRow(r).length, c: [] });
  }
  if (title && title === title.toUpperCase()) title = title.charAt(0) + title.slice(1).toLowerCase();
  return { title, artist, lines, unknown };
}
function chordImgUrl(im){
  const c = document.createElement('canvas'); c.width = im.w; c.height = im.h;
  c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(im.px), im.w, im.h), 0, 0);
  return c.toDataURL();
}
async function handlePdf(file){
  imp.phase = 'reading'; imp.err = ''; imp.step = 'Lecture de la grille…'; render();
  try {
    await syncLearned();
    const res = await analyzeSheet(file);
    imp.res = res; imp.fileName = file.name;
    if (res.unknown.size){
      imp.phase = 'names';
      imp.unknownList = [...res.unknown.entries()].map(([key, u]) => ({ key, sigs: u.sigs, url: chordImgUrl(u.im) }));
      render(); return;
    }
    finishImport();
  } catch (e) {
    if (!imp) return;
    imp.phase = 'file';
    imp.err = "Ce PDF n'a pas pu être lu. Vérifie que c'est bien une grille téléchargée sur La Boîte à chansons, puis réessaie.";
    render();
  }
}
function finishImport(){
  const res = imp.res;
  const lines = res.lines.map(L => ({ n: L.n, c: L.c.map(([name, wi, key]) => [name || learned.whole[key] || '?', wi]) }));
  let moments = momentsFromSheet({ lines });
  moments = moments.filter((m, i) => i === 0 || m.chord !== moments[i - 1].chord);
  if (!moments.length){ imp.phase = 'file'; imp.err = "Aucun accord trouvé dans ce PDF. Utilise une grille téléchargée sur La Boîte à chansons."; render(); return; }
  const song = { id: uid(), title: (res.title || imp.fileName.replace(/\.pdf$/i, '').split(' - ')[0]).trim(), artist: (res.artist || '').trim(), moments, lines: [], status: 'new', source: 'pdf', updatedAt: Date.now() };
  syncText(song);
  songs[song.id] = song; Store.save(song, true);
  closeImport();
  Object.assign(ui, { view: 'song', songId: song.id, idx: 0, edit: true });
  render(); window.scrollTo(0, 0);
}
function saveChordNames(){
  const missing = [];
  imp.unknownList.forEach((u, i) => {
    let v = (document.getElementById('cn' + i).value || '').trim().replace(/\s+/g, '');
    if (v) v = v.charAt(0).toUpperCase() + v.slice(1);
    u.value = v;
    if (!v || !chordShape(v)){ missing.push(i); return; }
    learned.whole[u.key] = v;
    if (u.sigs.length === v.length) u.sigs.forEach((s, j) => learned.glyphs.push([v[j], s[0], s[1]]));
  });
  if (missing.length){ imp.err = 'Il manque un nom, ou il ne commence pas par une lettre de A à G : recopie le nom écrit sur l’image (par exemple D4 ou Am7).'; render(); return; }
  imp.err = ''; saveLearned(); finishImport();
}

function momentsFromSheet(d){
  const moments = []; let prev = null, li = 0;
  (d.lines || []).forEach(L => {
    const n = Math.max(0, parseInt(L.n, 10) || 0);
    (Array.isArray(L.c) ? L.c : []).forEach(c => {
      const name = Array.isArray(c) ? c[0] : c, wi = Array.isArray(c) ? parseInt(c[1], 10) || 0 : 0;
      const sh = chordShape(name);
      const m = { id: uid(), text: '', lh: [], rh: [], br: false, w: null, chord: String(name) };
      if (sh){ m.rh = voice(sh, prev); prev = m.rh; m.lh = [48 + sh.bass]; }
      if (n > 0 && wi < n){ m.pl = li; m.pw = wi; m.pn = n; }
      moments.push(m);
    });
    if (n > 0) li++;
  });
  return moments;
}
function renderImport(){
  let h = `<div class="topbar"><button class="btn ghost" data-act="imp-close">← Mes chansons</button></div>
    <div class="title-block"><h1>Ajouter une chanson</h1></div><div class="imp-steps">`;
  if (imp.err) h += `<p class="err" role="alert">${esc(imp.err)}</p>`;
  if (imp.phase === 'names'){
    h += `<div class="panel">
      <p class="instr">Quelques accords sont nouveaux pour l'appli</p>
      <p class="hint">Recopie le nom écrit sur chaque image, lettre par lettre (par exemple Am7). L'appli les retiendra pour les prochaines chansons.</p>
      <div class="names">${imp.unknownList.map((u, i) => `<label class="name-row"><img src="${u.url}" alt="Accord ${i + 1}"><input type="text" id="cn${i}" value="${esc(u.value || '')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Nom de l'accord ${i + 1}"></label>`).join('')}</div>
      <div class="row"><button class="btn primary" data-act="imp-names">Continuer</button><button class="btn ghost" data-act="imp-close">Annuler</button></div>
    </div>`;
  } else if (imp.phase === 'reading'){
    h += `<div class="panel" aria-live="polite"><h2>Lecture de la grille…</h2><p class="hint" id="impStep">${esc(imp.step || '')}</p><p class="hint">Garde cette page ouverte.</p></div>`;
  } else {
    h += `<div class="panel">
      <p class="instr"><span class="n">1</span>Trouve ta chanson sur La Boîte à chansons</p>
      <p class="hint">Sur la page de la chanson, télécharge la grille en PDF.</p>
      <div><a class="btn" href="https://www.boiteachansons.net/partitions" target="_blank" rel="noopener">Ouvrir La Boîte à chansons</a></div>
    </div>
    <div class="panel">
      <p class="instr"><span class="n">2</span>Choisis le PDF téléchargé</p>
      <p class="hint">L'appli lit les accords, les transforme en touches et repère sur quel mot tombe chacun. Tu colleras ensuite les paroles depuis la page de la chanson : les accords se placeront tout seuls dessus.</p>
      <label class="file-drop"><span class="instr">Choisir le PDF</span><input type="file" accept="application/pdf,.pdf" data-act="imp-file"></label>
    </div>`;
  }
  h += `</div>`;
  app.innerHTML = h;
}
function impAction(act){
  if (act === 'imp-close'){ closeImport(); ui.view = 'library'; render(); }
  if (act === 'imp-names') saveChordNames();
}
function impInput(){}

/* ---------- Sauvegarde / restauration ---------- */
async function exportSongs(){
  const data = JSON.stringify({ app: 'carnet-piano', version: 1, exportedAt: Date.now(), songs: Object.values(songs), glyphs: learned });
  const d = new Date(), name = `carnet-piano-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
  if (window.claude && typeof window.claude.use === 'function'){
    const dl = await window.claude.use('downloads');
    if (dl){ try { await dl.save({ filename: name, data }); } catch (e) {} return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function importSongs(file){
  try {
    const d = JSON.parse(await file.text());
    const list = Array.isArray(d) ? d : d.songs;
    if (!Array.isArray(list)) throw 0;
    let n = 0;
    list.forEach(s => {
      if (!s || !Array.isArray(s.moments)) return;
      const id = s.id || uid();
      if (songs[id] && (songs[id].updatedAt || 0) > (s.updatedAt || 0)) return;
      songs[id] = { ...s, id }; Store.save(songs[id], true); n++;
    });
    if (d.glyphs && Array.isArray(d.glyphs.glyphs)){
      learned = { glyphs: [...learned.glyphs, ...d.glyphs.glyphs], whole: { ...learned.whole, ...(d.glyphs.whole || {}) } };
      saveLearned();
    }
    ui.notice = n ? `${n} chanson${n > 1 ? 's' : ''} importée${n > 1 ? 's' : ''}.` : 'Aucune nouvelle chanson dans ce fichier.';
  } catch (e) { ui.notice = "Ce fichier n'est pas une sauvegarde du carnet."; }
  render();
}

/* ---------- Événements ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act.startsWith('imp-')){ if (imp && act !== 'imp-file') impAction(act, b, e); return; }
  if (ui.view === 'song' && curSong() && SONG_ACTS.has(act)){ songAction(act, b); return; }
  const s = curSong(), m = curMo();
  switch (act){
    case 'new': ui.creating = true; render(); break;
    case 'cancel-new': ui.creating = false; render(); break;
    case 'create': {
      const title = document.getElementById('nTitle').value.trim() || 'Sans titre';
      const artist = document.getElementById('nArtist').value.trim();
      const lines = document.getElementById('nLyrics').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const moments = lines.length ? lines.map(t => ({ id: uid(), text: t, lh: [], rh: [], br: true })) : [{ id: uid(), text: '', lh: [], rh: [], br: true }];
      const song = { id: uid(), title, artist, moments, status: 'new', updatedAt: Date.now() };
      songs[song.id] = song; Store.save(song, true);
      Object.assign(ui, { creating: false, view: 'song', songId: song.id, idx: 0, edit: true });
      render(); window.scrollTo(0, 0); break;
    }
    case 'demo': { const d = demoSong(); songs[d.id] = d; Store.save(d, true); Object.assign(ui, { view: 'song', songId: d.id, idx: 0, edit: false }); render(); window.scrollTo(0, 0); break; }
    case 'open': prefs.opened = { ...(prefs.opened || {}), [b.dataset.id]: Date.now() }; savePrefs(); Object.assign(ui, { place: null, view: 'song', songId: b.dataset.id, idx: 0, edit: false, chordErr: '' }); render(); window.scrollTo(0, 0); break;
    case 'home': stopScroll(); ui.place = null; ui.view = 'library'; render(); window.scrollTo(0, 0); break;
    case 'mode-play': ui.edit = false; render(); break;
    case 'mode-edit': stopScroll(); ui.edit = true; render(); break;
    case 'prev': goTo(ui.idx - 1); break;
    case 'next': goTo(ui.idx + 1); break;
    case 'go': goTo(+b.dataset.i); break;
    case 'listen': { const k = displayKeys(s, ui.idx); const was = prefs.sound; prefs.sound = true; play([...k.lh, ...k.rh]); prefs.sound = was; break; }
    case 'show': s.show = b.dataset.v; touch(); render(); break;
    case 'word': {
      const words = (m.text || '').split(/\s+/).filter(Boolean), w = +b.dataset.w;
      const moved = words.slice(w).join(' ');
      m.text = words.slice(0, w).join(' ');
      let n = s.moments[ui.idx + 1];
      if (!n){ n = { id: uid(), text: '', lh: [], rh: [], br: false }; s.moments.push(n); }
      n.text = (moved + ' ' + (n.text || '')).trim();
      touch(); render(); break;
    }
    case 'pull': {
      const n = s.moments[ui.idx + 1]; if (!n || !n.text) break;
      const nw = n.text.split(/\s+/).filter(Boolean);
      m.text = ((m.text || '') + ' ' + nw.shift()).trim(); n.text = nw.join(' ');
      touch(); render(); break;
    }
    case 'key': {
      const k = +b.dataset.m;
      if (ui.edit){
        const mine = ui.hand, other = mine === 'lh' ? 'rh' : 'lh';
        if (m[mine].includes(k)) m[mine] = m[mine].filter(x => x !== k);
        else { m[mine].push(k); m[mine].sort((a, c) => a - c); m[other] = m[other].filter(x => x !== k); }
        touch(); render();
      }
      const was = prefs.sound; prefs.sound = true; play([k], false); prefs.sound = was;
      break;
    }
    case 'hand-l': ui.hand = 'lh'; render(); break;
    case 'hand-r': ui.hand = 'rh'; render(); break;
    case 'combo': {
      const show = s.show || 'both';
      const c = combos(s).map(x => visKeys(s, x)).filter(x => x.lh.length || x.rh.length)[+b.dataset.i];
      if (c){ if (show !== 'rh') m.lh = [...c.lh]; if (show !== 'lh') m.rh = [...c.rh]; touch(); render(); play([...c.lh, ...c.rh]); }
      break;
    }
    case 'chord': {
      const v = document.getElementById('chordIn').value;
      const k = chordToKeys(v);
      if (!k){ ui.chordErr = v.trim() ? `« ${v.trim()} » n'est pas reconnu. Essaie une forme simple comme Am, C, F, G7 ou Dm.` : 'Tape un nom d’accord, par exemple Am.'; render(); break; }
      ui.chordErr = ''; m.lh = k.lh; m.rh = k.rh; touch(); render(); play([...m.lh, ...m.rh]); break;
    }
    case 'clear': m.lh = []; m.rh = []; touch(); render(); break;
    case 'split': {
      const input = document.getElementById('moText');
      const pos = ui.caret ?? input.value.length;
      const a = input.value.slice(0, pos).trim(), c = input.value.slice(pos).trim();
      if (!a || !c){ ui.msg = 'Place le curseur entre deux mots dans les paroles, puis appuie sur « Couper au curseur ».'; render(); break; }
      m.text = a;
      s.moments.splice(ui.idx + 1, 0, { id: uid(), text: c, lh: [...m.lh], rh: [...m.rh], br: false });
      ui.caret = null; touch(); goTo(ui.idx + 1, false); break;
    }
    case 'push': {
      const input = document.getElementById('moText');
      const pos = ui.caret ?? 0;
      const a = input.value.slice(0, pos).trim(), c = input.value.slice(pos).trim();
      if (!c){ ui.msg = 'Place le curseur juste avant les mots à envoyer au moment suivant.'; render(); break; }
      const n = s.moments[ui.idx + 1]; m.text = a; n.text = (c + ' ' + (n.text || '')).trim();
      ui.caret = null; touch(); goTo(ui.idx + 1, false); break;
    }
    case 'import': openImport(); break;
    case 'export': exportSongs(); break;
    case 'filter': ui.filter = b.dataset.f; render(); break;
    case 'status': {
      const k = b.dataset.s;
      s.status = k; if (k === 'learned') s.checkedAt = Date.now();
      touch(); render(); break;
    }
    case 'fav': s.fav = !s.fav; touch(); render(); break;
    case 'add-after': s.moments.splice(ui.idx + 1, 0, { id: uid(), text: '', lh: [], rh: [], br: false }); touch(); goTo(ui.idx + 1, false); break;
    case 'add-end': s.moments.push({ id: uid(), text: '', lh: [], rh: [], br: true }); touch(); goTo(s.moments.length - 1, false); break;
    case 'move-l': case 'move-r': {
      const j = act === 'move-l' ? ui.idx - 1 : ui.idx + 1;
      [s.moments[ui.idx], s.moments[j]] = [s.moments[j], s.moments[ui.idx]];
      s.moments[0].br = true; touch(); goTo(j, false); break;
    }
    case 'del-mo': s.moments.splice(ui.idx, 1); s.moments[0].br = true; touch(); goTo(Math.min(ui.idx, s.moments.length - 1), false); break;
    case 'del-card': {
      ui.confirmDel = b.dataset.id; render();
      const y = app.querySelector('[data-act="del-yes"]'); if (y) y.focus();
      break;
    }
    case 'del-song':
      ui.confirmDel = s.id; render();
      { const y = app.querySelector('[data-act="del-yes"]'); if (y){ y.focus(); y.scrollIntoView({ block: 'center' }); } }
      break;
    case 'del-yes': {
      const id = b.dataset.id; ui.confirmDel = null;
      if (songs[id]) Store.remove(id);
      if (ui.view === 'song' && ui.songId === id) ui.view = 'library';
      render(); break;
    }
    case 'del-no': ui.confirmDel = null; render(); break;
  }
});
app.addEventListener('change', e => {
  const act = e.target.dataset.act;
  if (e.target.id === 'sortSel'){ prefs.sort = e.target.value; savePrefs(); render(); return; }
  if (act === 'imp-file' && imp && e.target.files[0]){ handlePdf(e.target.files[0]); return; }
  if (act === 'import-json' && e.target.files[0]){ importSongs(e.target.files[0]); return; }
  if (act === 't-sound'){ prefs.sound = e.target.checked; savePrefs(); }
  if (act === 't-names'){ prefs.names = e.target.checked; savePrefs(); render(); }
  if (act === 'br'){ const s = curSong(), g = groupsOf(s)[ui.idx]; s.moments[g.m[0]].br = e.target.checked; touch(); render(); }
});
app.addEventListener('input', e => {
  if (e.target.id === 'speedIn'){ prefs.speedN = +e.target.value; savePrefs(); const v = document.getElementById('speedVal'); if (v) v.textContent = prefs.speedN; return; }
  if (ui.view === 'import' && imp){ impInput(e); return; }
  const s = curSong(); if (!s) return;
  if (e.target.id === 'moText'){
    setGroupText(s, groupsOf(s)[ui.idx], e.target.value); ui.caret = e.target.selectionStart; touch();
    const w = app.querySelector('.mo[aria-current="true"] .words');
    if (w){ w.textContent = e.target.value || '…'; w.classList.toggle('none', !e.target.value); }
    const n = app.querySelector('.now-words'); if (n) n.textContent = e.target.value;
  }
  if (e.target.id === 'sTitle'){ s.title = e.target.value; touch(); }
  if (e.target.id === 'sArtist'){ s.artist = e.target.value; touch(); }
});
['keyup', 'click', 'select'].forEach(ev => app.addEventListener(ev, e => {
  if (e.target.id === 'moText') ui.caret = e.target.selectionStart;
}));
app.addEventListener('keydown', e => {
  if (e.target.id === 'chordIn' && e.key === 'Enter'){ e.preventDefault(); app.querySelector('[data-act="chord"]').click(); }
});
document.addEventListener('keydown', e => {
  if (ui.view !== 'song' || ui.place) return;
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || (e.key === ' ' && t !== 'BUTTON')){ e.preventDefault(); goTo(ui.idx + 1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); goTo(ui.idx - 1); }
});

loadSoundfont();
Store.init();
})();
